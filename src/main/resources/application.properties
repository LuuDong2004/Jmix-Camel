main.datasource.url=jdbc:postgresql://localhost:5432/jmix-camel
main.datasource.username=postgres
main.datasource.password=123

main.datasource.driver-class-name=org.postgresql.Driver

main.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
main.jpa.hibernate.ddl-auto=update

main.liquibase.change-log=com/vn/jmixcamel/liquibase/changelog.xml

jmix.ui.login-view-id=LoginView
jmix.ui.main-view-id=MainView
jmix.ui.menu-config=com/vn/jmixcamel/menu.xml
jmix.ui.composite-menu=true

ui.login.defaultUsername=admin
ui.login.defaultPassword=admin

jmix.core.available-locales=en

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false

logging.level.org.atmosphere=warn

# 'debug' level logs SQL generated by EclipseLink ORM
logging.level.eclipselink.logging.sql=info

# 'debug' level logs data store operations
logging.level.io.jmix.core.datastore=info

# 'debug' level logs access control constraints
logging.level.io.jmix.core.AccessLogger=debug

# 'debug' level logs all Jmix debug output
logging.level.io.jmix=info

# 'debug' or 'trace' levels help to troubleshoot security problems
logging.level.org.springframework.security=info

# Transform plugin runtime
transforms.plugins-dir=E:/Spring/Plugins
transforms.default-timeout-ms=5000
transforms.max-writes-bytes=1048576
transforms.pool-size=8
# Allowlist — plugin IDs exposed via /api/transforms/plugins (uploaded plugins
# auto-enable at runtime when transforms.upload.auto-enable=true, regardless of this list).
transforms.enabled-plugins=customer-normalizer
# Plugin upload (admin runtime install)
transforms.upload-max-bytes=20971520
transforms.upload-auto-enable=true

# Spring multipart limits — must be >= transforms.upload-max-bytes
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

logging.level.transform.plugin=info
logging.level.com.vn.jmixcamel.transform=info
logging.level.transform.upload.audit=info